<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Página de error 404: GitHub Pages la muestra cuando alguien entra a una dirección que no existe. Va en la raíz del repositorio, junto a index.html. -->
<title>Página no encontrada | Nómada VN</title>
<!-- Le pide a Google que no indexe esta página de error. -->
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0d0b0d">
<!-- Ícono de la pestaña: cuadrado violeta con la letra N. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23d92d48'/%3E%3Ctext x='32' y='46' font-size='40' font-weight='800' text-anchor='middle' fill='white' font-family='Arial'%3EN%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<!-- Esta página no usa styles.css: lleva sus propios estilos, así se ve bien en cualquier dirección. -->
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:#0d0b0d;color:#f1e6e2;font-family:'Plus Jakarta Sans',system-ui,sans-serif;text-align:center}
/* Tarjeta central con efecto "vidrio", igual que en el resto del sitio */
.tarjeta{max-width:460px;width:100%;background:rgba(26,18,20,.72);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid rgba(255,140,150,.12);border-radius:24px;padding:36px 28px;box-shadow:0 0 40px -10px rgba(242,59,85,.28)}
.logo{height:56px;width:auto;margin-bottom:20px}
/* Número 404 con degradado violeta a rosa */
.numero{font-size:88px;font-weight:800;line-height:1;margin:0;background:linear-gradient(90deg,#ff93a4,#ff5f98);-webkit-background-clip:text;background-clip:text;color:transparent}
h1{font-size:20px;margin:14px 0 8px}
p{color:#a2918e;font-size:14px;line-height:1.6;margin:0 0 26px}
/* Botón "Volver al inicio" */
.boton{display:inline-block;background:linear-gradient(90deg,#d92d48,#d62369);color:#fff;font-weight:700;font-size:14px;padding:13px 26px;border-radius:12px;text-decoration:none;box-shadow:0 10px 25px -10px rgba(242,59,85,.5)}
.boton:hover{filter:brightness(1.12)}
</style>
</head>
<body>
  <main class="tarjeta">
    <!-- Logo del sitio (ruta desde la raíz, para que cargue en cualquier dirección) -->
    <img class="logo" src="/assets/images/logo/logo.png" alt="Nómada VN">
    <p class="numero">404</p>
    <h1>Esta página no existe</h1>
    <p>Puede que el enlace esté mal escrito o que el juego haya cambiado de lugar. Volvé al inicio y buscalo desde el catálogo.</p>
    <!-- Botón para volver a la página principal -->
    <a class="boton" href="/">Volver al inicio</a>
  </main>
</body>
</html>
