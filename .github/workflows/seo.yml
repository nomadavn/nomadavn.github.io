# Cada 3 horas (y cuando lo pidas a mano) arma una página por cada juego y actualiza sitemap.xml.
name: Páginas de juegos para Google
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/generar-seo.mjs
      - name: Guardar cambios
        run: |
          git config user.name "nomada-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A juego sitemap.xml index.html
          git diff --cached --quiet || (git commit -m "Actualizar páginas de juegos y sitemap" && git push)
